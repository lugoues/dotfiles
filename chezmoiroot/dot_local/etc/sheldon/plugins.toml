shell = "zsh"

[templates]
defer = "{{ hooks?.pre | nl }}{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}{{ hooks?.post | nl }}"
maybe = "{{ hooks?.pre | nl }} [[ -f {{ name }} ]] && source {{ file }} {{ hooks?.post | nl }}"

[plugins.zsh-defer]
github = "romkatv/zsh-defer"

[plugins.powerlevel10k]
github = "romkatv/powerlevel10k"

[plugins.configuration]
local = "~/.local/etc/zsh/configuration"

# Cached tool init that must be in place before the first prompt, e.g. starship.
# Written by run_onchange_after_20-cache-shell-init.sh, not checked in.
[plugins.zsh-init]
local = "~/.local/share/zsh/init.d"

[plugins.zshrc-local]
inline = "[[ -f ~/.zshrc.local ]] && source ~/.zshrc.local"

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
apply = ["defer"]

[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
apply = ["defer"]

[plugins.commands]
local = "~/.local/etc/zsh/commands"
apply = ["defer"]

[plugins.compinit]
inline = "autoload -Uz compinit && zsh-defer compinit"

# Deferred tool init, e.g. patina. Last on purpose: zsh-defer runs its queue in
# the order entries appear here, so everything above will be loaded prior.
[plugins.zsh-init-defer]
local = "~/.local/share/zsh/init-defer.d"
apply = ["defer"]